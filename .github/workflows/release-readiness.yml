name: Release readiness (no publication)
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
      BETTER_AUTH_SECRET: readiness-placeholder-not-for-hosting
      BETTER_AUTH_URL: http://localhost:3000
      AI_PROVIDER: ''
      NEXT_TELEMETRY_DISABLED: '1'
      OPENPREP_COMPLIANCE_STATS: '1'
      OPENPREP_COMPLIANCE_DIR: .release/phase4/webpack
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install jsonschema==4.25.1
      - run: npx prisma generate
      - run: npm run test:unit
      - run: npm run compliance:test
      - run: npm run build -- --webpack
      - name: Inventory exact local candidate bytes
        run: python scripts/release-compliance.py sbom --output-dir docs/audit/phase4-artifacts --webpack-dir .release/phase4/webpack --grant-evidence docs/audit/phase4-dependency-grants.json
      - name: Validate SBOM schemas
        run: python scripts/validate-sbom.py --directory docs/audit/phase4-artifacts
      - name: Required release gate
        run: python scripts/release-compliance.py check --output-dir docs/audit/phase4-artifacts --grant-evidence docs/audit/phase4-dependency-grants.json
      - name: Retain audit metadata only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-readiness-metadata
          path: |
            docs/audit/phase4-artifacts/compliance-report.json
            docs/audit/phase4-artifacts/SBOM_*.json
          if-no-files-found: warn
          retention-days: 7
